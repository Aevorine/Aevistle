<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#14161b" media="(prefers-color-scheme: dark)" />
    <!-- Both values are the default style's --bg from theme.css. They are
         duplicated here because the browser needs them before any stylesheet
         has parsed; if that file is retuned, these move with it.

         They are the fallback only. Once the app is up it reads the real --bg
         for the chosen visual style and inserts a `data-live` theme-color tag
         ahead of these two — six styles have six grounds, and a static pair
         could only ever be right for one of them. See the appearance effect in
         state/AppState.tsx. -->
    <meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="description" content="Aevistle — scheduled email reminders with attachments, for Windows and Android." />

    <!--
      Content Security Policy.

      The renderer is a local app: it has no business loading remote script,
      opening a socket, or embedding a frame. Locking that down here means an
      injected string in a subject line or a template has nowhere to go even if
      it somehow reached the DOM as markup.

      'unsafe-inline' for style is required because the app sets a handful of
      inline layout styles; scripts have no such exemption.

      `frame-src 'self' data:` rather than 'none'. The attachment preview shows
      a PDF or a text file in `<iframe sandbox="" src="data:…">`, and 'none'
      blocked it — the modal opened onto an empty white box with no error, no
      toast and nothing in the UI to suggest anything had gone wrong. Verified
      with a real Electron window before and after: ERR_BLOCKED_BY_CSP on both
      the PDF and the text frame.

      `blob:` is listed for the same frame: a blob URL is the better carrier
      for a 20 MB attachment than a base64 string in an attribute, and the
      preview falls back to it.

      Allowing either here costs nothing: that frame carries `sandbox=""`, so
      its content is an opaque origin that cannot run script, reach the parent
      or make a request. The message-body frame is unaffected either way — it
      uses `srcdoc`, which inherits this policy rather than being matched by
      `frame-src`.

      `frame-ancestors` is gone because it is *ignored* in a <meta> tag; the
      browser says so in the console on every load. Nothing can frame a
      `file://` renderer with no remote content anyway.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        font-src 'self' data:;
        connect-src 'self';
        media-src 'self';
        object-src 'none';
        frame-src 'self' data: blob:;
        worker-src 'self' blob:;
        base-uri 'none';
        form-action 'none';
      "
    />

    <title>Aevistle</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
