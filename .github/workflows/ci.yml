# The checks a contributor is asked to run before opening a pull request, run
# again by a machine that cannot forget.
#
# This deliberately does not build or publish a release. Releases are signed
# with a GPG key that exists only on the maintainer's machine and is not going
# to be copied into a CI secret — see SECURITY.md.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/assets/**'
      - LICENSE
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The release gate below. `published` rather than `created` so it fires once,
  # when the release stops being a draft and the assets are actually there to
  # verify.
  release:
    types: [published]

permissions:
  contents: read

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks (Node ${{ matrix.node }})
    # A published release runs the release gate below and not this: the commit
    # a tag points at has already been through here on its way to `main`, and
    # running the whole chain twice would only make the release page's status
    # slower to settle.
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor and 24 is what a new contributor installs today.
        #
        # 20 was here, and could never have passed: `check:layout` and the other
        # browser probes drive Chrome over CDP and need a global `WebSocket`,
        # which arrived in Node 22 — the probe says so itself and exits 1. That
        # went unnoticed because `npm ci` was failing before any check ran (see
        # the eslint/TS-7 removal), so this leg had never got far enough to
        # report the real reason it was red.
        #
        # Both entries are evidence-backed rather than aspirational: the whole
        # chain is run on 24 locally before every release, and 22 is what the
        # green runs on this workflow use.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # .npmrc points at a mirror that is fast where the maintainer is and only
      # usually fast from a GitHub runner. The lockfile carries integrity
      # hashes either way, so falling back to the canonical registry changes
      # where the bytes come from and nothing about what they are.
      - name: Install
        run: |
          npm ci --no-audit --no-fund \
            || npm ci --no-audit --no-fund \
                 --registry=https://registry.npmjs.org \
                 --replace-registry-host=always

      # typecheck + the fourteen check:* scripts + audit:self + audit:deps.
      # Same command CONTRIBUTING.md asks a contributor to run.
      - name: npm run check
        run: npm run check

      # Type-correct code can still fail to bundle. This is the web and
      # Electron main bundles only — no installer, no packaging, no signing.
      - name: Build bundles
        run: npm run build

  # ---------------------------------------------------------------------------
  # The release gate — the half of the checks that can only run after a release
  # exists.
  #
  # `check:signing` verifies the *published* signature against the *published*
  # public key, which is the only thing a stranger downloading the installer can
  # do and therefore the only thing worth asserting. It was written months ago
  # and has only ever been run by hand, on the maintainer's own machine, in the
  # same session as the release it was checking — which is the session least
  # likely to notice that it was skipped. Signing is a step in a process, and a
  # step in a process is a step somebody skips on the evening it is
  # inconvenient; after that every later release is unsigned too and nothing
  # anywhere says so.
  #
  # Deliberately not gated on secrets. It needs no key: verification uses the
  # public key that ships with the release.
  # ---------------------------------------------------------------------------
  release-gate:
    name: Published release is signed
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: |
          npm ci --no-audit --no-fund \
            || npm ci --no-audit --no-fund \
                 --registry=https://registry.npmjs.org \
                 --replace-registry-host=always

      # `gpg` is present on ubuntu-latest; asserted rather than assumed, because
      # a missing binary would otherwise be reported by the check itself as
      # "could not verify", which is the one answer that must not read as a pass.
      - name: gpg is available
        run: gpg --version | head -1

      - name: Verify the published signature
        run: npm run check:signing

      # The update manifest is what an installed copy trusts when it decides
      # whether to offer an upgrade. An unsigned or mis-signed one is how a
      # release breaks every existing install rather than just itself.
      - name: Verify the update manifest signing chain
        run: npm run check:update-signing
