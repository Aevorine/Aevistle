appId: dev.aevistle.app
productName: Aevistle
copyright: Copyright © 2026 Aevistle contributors

# The one string in this file that has to be short, and the reason the Start
# menu, the desktop shortcut and the pinned taskbar button all showed a blank
# icon.
#
# electron-builder's NSIS template passes the package.json `description`
# straight through as the shortcut comment:
#
#     CreateShortCut "$newStartMenuLink" "$appExe" "" "$appExe" 0 "" "" "${APP_DESCRIPTION}"
#
# (node_modules/app-builder-lib/templates/nsis/include/installer.nsh:197 and
# :223). A .lnk stores its strings as a chain of length-prefixed UTF-16 runs —
# NAME, then WORKING_DIR, then ICON_LOCATION — and the shell's own reader gives
# up on a NAME longer than 260 characters (MAX_PATH). It does not truncate; it
# keeps reading from the wrong offset, so every field *after* the description is
# recovered as rubbish. Our package.json description is 285 characters, so the
# shortcut's icon path came back as an unprintable non-path and Windows drew
# nothing at all. The executable's own icon resource was never the problem: the
# built exe carries a complete 7-frame icon group and Windows renders all of
# 16/32/48 from it correctly.
#
# Measured with WScript.Shell against shortcuts built by hand: a 260-character
# comment round-trips an intact IconLocation, 261 does not. Kept well under the
# line so that nobody has to remember the boundary before appending a clause.
#
# `extraMetadata` rather than editing package.json, because the long form is
# still the right text for the README, the store listings and the repository
# page. Only the shortcut needs the short one.
extraMetadata:
  description: >-
    Schedule email to send later on Windows and Android: one-off reminders or
    recurring sends — daily, weekly, monthly, cron — with attachments,
    delivered while the app is closed.

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - '!**/*.map'
  - '!**/{.eslintrc,.editorconfig,.gitignore,.npmrc}'
  - '!**/{test,tests,__tests__,example,examples,docs}/**'

  # Belt and braces. The Capacitor packages are devDependencies, so they should
  # never be collected — but `cap sync` makes Gradle build *inside*
  # node_modules/@capacitor/android, which grows to ~25 MB of Android
  # intermediates. When those did get collected, electron-builder died with
  # ENOMEM rather than a useful message, so the exclusion stays as a guard.
  - '!**/node_modules/@capacitor/**'
  - '!**/{build,.gradle,.idea,captures}/intermediates/**'

# Anything the app needs at runtime that is not bundled by esbuild.
# nodemailer is external in the bundle, so it must ship as a real dependency.
npmRebuild: false

asar: true
asarUnpack:
  - '**/*.node'

# The tray icon is not optional decoration: closing the window hides the app to
# the tray, and without a tray entry the user has no way back and no visible
# sign that schedules are still running. `buildResources` is excluded from the
# app bundle by design, so the icon is copied in explicitly and the main process
# looks for it under `process.resourcesPath`.
extraResources:
  - from: build/tray.png
    to: build/tray.png
  # The MCP server and CLI. Shipped rather than published separately so the
  # path the Settings card prints exists on the user's machine straight after
  # install, with nothing to clone and nothing to npm install.
  - from: integrations
    to: integrations
    filter:
      - '**/*.mjs'
      - README.md

win:
  icon: build/icon.ico
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Wizard artwork, generated by scripts/generate-icons.py from the same
  # source as every other icon. The dimensions are fixed by NSIS: 150x57 for
  # the header strip, 164x314 for the welcome and finish panels.
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  # Appends "Aevistle" to a directory the user picked, and asks at uninstall
  # time whether their data should go too. See build/installer.nsh.
  include: build/installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Aevistle
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-${version}-win-x64-setup.${ext}

portable:
  artifactName: ${productName}-${version}-win-x64-portable.${ext}

linux:
  icon: build/icon.png
  category: Office
  target:
    - AppImage
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - dmg
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
