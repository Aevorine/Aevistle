apply plugin: 'com.android.application'

/**
 * Release signing.
 *
 * The keystore deliberately lives OUTSIDE the repository — a signing key in
 * git is a key you have to assume is compromised. Point the build at one with
 * either environment variables or ~/.aevistle/keystore.properties.
 *
 * When neither is present, a release build FAILS. It used to fall back to the
 * Android debug key, which produced an APK that installs and runs and looks
 * exactly like the real thing — and can never be updated over the real thing,
 * because Android will not accept an upgrade signed by a different key. The
 * only warning was one `logger.lifecycle` line in the middle of several hundred
 * others. Publishing that APK is a mistake with no undo: every install of it
 * has to be manually uninstalled before the genuine build will go on.
 *
 * Debug builds are untouched — they have always used the debug key and always
 * should. See the task-graph check below for how the two are told apart.
 */
def releaseSigning = null
def keystoreFile = System.getenv('AEVISTLE_KEYSTORE')
def keystorePassword = System.getenv('AEVISTLE_KEYSTORE_PASSWORD')
def keyAliasName = System.getenv('AEVISTLE_KEY_ALIAS')
def keyPasswordValue = System.getenv('AEVISTLE_KEY_PASSWORD')
def signingProblem = null

def propsFile = new File("${System.properties['user.home']}/.aevistle/keystore.properties")
if (keystoreFile == null && propsFile.exists()) {
    def props = new Properties()
    propsFile.withInputStream { props.load(it) }
    keystoreFile = props.getProperty('storeFile')
    keystorePassword = props.getProperty('storePassword')
    keyAliasName = props.getProperty('keyAlias')
    keyPasswordValue = props.getProperty('keyPassword')
}

if (keystoreFile == null) {
    signingProblem = 'no keystore configured (neither AEVISTLE_KEYSTORE nor ' +
        "${propsFile} was found)"
} else if (!new File(keystoreFile).exists()) {
    // The path is not a secret — the existing lifecycle log already printed it,
    // and naming the file that is missing is the whole point of the message.
    // Passwords are never read back out of here.
    signingProblem = "the configured keystore does not exist: ${keystoreFile}"
} else if (!keystorePassword || !keyAliasName || !keyPasswordValue) {
    // Caught here rather than left to Gradle, which reports a missing alias as
    // a keystore integrity failure several hundred lines into the build.
    def missing = []
    if (!keystorePassword) missing << 'storePassword / AEVISTLE_KEYSTORE_PASSWORD'
    if (!keyAliasName) missing << 'keyAlias / AEVISTLE_KEY_ALIAS'
    if (!keyPasswordValue) missing << 'keyPassword / AEVISTLE_KEY_PASSWORD'
    signingProblem = "the keystore was found but these are not set: ${missing.join(', ')}"
} else {
    releaseSigning = [
        storeFile    : new File(keystoreFile),
        storePassword: keystorePassword,
        keyAlias     : keyAliasName,
        keyPassword  : keyPasswordValue
    ]
    logger.lifecycle("Aevistle: signing release with ${keystoreFile}")
}

/**
 * The deliberate way to get the old behaviour back.
 *
 * There is a real use for a debug-signed release build — checking that R8-off
 * release packaging still sends mail, on a device, without holding the
 * publishing key. What there is no use for is getting one by accident. So it
 * stays available, behind an environment variable you cannot set without
 * meaning to, and it shouts on every build.
 */
def allowUnsignedRelease = ['1', 'true', 'yes'].contains(
    (System.getenv('AEVISTLE_ALLOW_UNSIGNED_RELEASE') ?: '').trim().toLowerCase())

if (releaseSigning == null) {
    if (allowUnsignedRelease) {
        logger.warn('')
        logger.warn('  ****************************************************************')
        logger.warn('  *  AEVISTLE_ALLOW_UNSIGNED_RELEASE is set.                     *')
        logger.warn('  *  This release APK will be signed with the ANDROID DEBUG KEY. *')
        logger.warn('  *  It cannot be published and cannot be upgraded over a real   *')
        logger.warn('  *  release. Local testing only.                                *')
        logger.warn("  *  Reason: ${signingProblem}")
        logger.warn('  ****************************************************************')
        logger.warn('')
    } else {
        /*
         * Deferred to the task graph rather than thrown here, because this file
         * is configured for every build — including `assembleDebug`, which has
         * no business caring whether a publishing key exists. `whenReady` is
         * the first point at which "is a release actually being built?" has an
         * answer.
         *
         * Scoped to this project: the Capacitor and Cordova library modules have
         * their own `assembleRelease` tasks that a perfectly ordinary app build
         * pulls in, and tripping on those would fail everything.
         */
        def thisProject = project
        def releaseTaskPattern = java.util.regex.Pattern.compile('^(assemble|bundle|install|package).*Release$')
        gradle.taskGraph.whenReady { graph ->
            def wantsRelease = graph.allTasks.any { t ->
                t.project == thisProject && releaseTaskPattern.matcher(t.name).matches()
            }
            if (!wantsRelease) return

            throw new GradleException("""

  Aevistle: refusing to build a release without a signing key.

  ${signingProblem}

  This used to silently fall back to the Android debug key. The resulting APK
  installs and runs, so the mistake is invisible until you try to ship an
  update over it — at which point every user has to uninstall by hand.

  Provide a key with either:

    ${propsFile}
        storeFile=/absolute/path/to/aevistle.jks
        storePassword=...
        keyAlias=...
        keyPassword=...

  or these environment variables:

    AEVISTLE_KEYSTORE, AEVISTLE_KEYSTORE_PASSWORD,
    AEVISTLE_KEY_ALIAS, AEVISTLE_KEY_PASSWORD

  For a throwaway build you will never publish, set
  AEVISTLE_ALLOW_UNSIGNED_RELEASE=1 to go back to the debug key.
""")
        }
    }
}

android {
    namespace = "dev.aevistle.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "dev.aevistle.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 68
        versionName "0.3.29"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildFeatures {
        // AevistleNativePlugin reads BuildConfig.VERSION_NAME for the About panel.
        buildConfig = true
    }

    signingConfigs {
        if (releaseSigning != null) {
            release {
                storeFile releaseSigning.storeFile
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            // R8 is off on purpose: JavaMail resolves its providers by
            // reflection out of META-INF/javamail.*, and a stripped build fails
            // at the first send with "no provider for smtp", which no user
            // could diagnose. The APK is a few MB either way.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Left unset when there is no key and no explicit opt-in, which
            // would package unsigned — but the task-graph check above has
            // already failed the build long before packaging runs. The debug
            // key is only ever used here when someone asked for it by name.
            if (releaseSigning != null) {
                signingConfig signingConfigs.release
            } else if (allowUnsignedRelease) {
                signingConfig signingConfigs.debug
            }
        }
    }

    packagingOptions {
        resources {
            // android-mail and android-activation both ship these, and the
            // merger treats any duplicate as a hard error.
            //
            // The split matters: legal text is dropped, but the javamail.*
            // and mailcap entries are how JavaMail finds its SMTP provider at
            // runtime. Excluding those instead of picking one would build
            // fine and then fail on the first send with "no provider for smtp".
            excludes += ['META-INF/LICENSE.md',
                         'META-INF/LICENSE.txt',
                         'META-INF/LICENSE',
                         'META-INF/NOTICE.md',
                         'META-INF/NOTICE.txt',
                         'META-INF/NOTICE',
                         'META-INF/DEPENDENCIES',
                         'META-INF/INDEX.LIST']

            pickFirsts += ['META-INF/mailcap',
                           'META-INF/mailcap.default',
                           'META-INF/mimetypes.default',
                           'META-INF/javamail.default.providers',
                           'META-INF/javamail.default.address.map',
                           'META-INF/javamail.providers',
                           'META-INF/javamail.address.map',
                           'META-INF/javamail.charset.map']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // Scheduled sends: WorkManager runs them, JavaMail performs them.
    implementation "androidx.work:work-runtime:2.10.0"
    implementation "com.sun.mail:android-mail:1.6.7"
    implementation "com.sun.mail:android-activation:1.6.7"

    // Receiving: same JavaMail dependency above also carries an IMAP
    // provider, so no separate library is needed for that half. Jsoup
    // sanitizes received HTML before it reaches the WebView — see
    // InboxSanitizer.java.
    implementation "org.jsoup:jsoup:1.17.2"

    // OAuth2 consent has to happen in the system browser, not in a WebView:
    // RFC 8252 §8.12 forbids the embedded kind, and both Google and Microsoft
    // refuse embedded user agents outright — so the "simpler" in-process
    // version does not merely break the guarantee, it does not work. This is
    // the Custom Tabs client library: it keeps the browser's own cookie jar and
    // address bar (which is what lets a password manager fill the form and the
    // user see who they are signing in to) while looking like part of the app.
    // See OAuthConsent.java.
    implementation "androidx.browser:browser:1.8.0"

    // Saving a received attachment to a folder the user picked. Android has no
    // writable path outside app storage, so the destination is a SAF tree URI
    // and DocumentFile is what turns one into "create a file in here".
    implementation "androidx.documentfile:documentfile:1.0.1"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
